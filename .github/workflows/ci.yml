name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test & release smoke check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build clean release bundle
        env:
          RELEASE_BUILD: "1"
        run: npm run build

      - name: Pack & smoke-test prebuilt tarball
        run: |
          npm run release:pack
          tmp="$(mktemp -d)"
          tar -xzf dist-release/v2echo-notifier-cf-v*.tar.gz -C "$tmp"
          node -e '
            const fs = require("fs");
            const p = process.argv[1] + "/.cloudflare/output/v0/workers/default/worker.config.json";
            const cfg = JSON.parse(fs.readFileSync(p, "utf8"));
            cfg.env.DB.id = "11111111-1111-4111-8111-111111111111";
            fs.writeFileSync(p, JSON.stringify(cfg, null, 2));
          ' "$tmp"
          (
            cd "$tmp"
            CLOUDFLARE_ACCOUNT_ID=00000000000000000000000000000000 \
              "$GITHUB_WORKSPACE/node_modules/.bin/cf" deploy --dry-run --prebuilt --mode production
          )
          rm -rf "$tmp"
